<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JLPT N1 合格!</title>
<!-- Pretendard 공식 배포(orioncactus/pretendard v1.3.9, SIL OFL). 쓰는 글자만 내려받는 동적 서브셋 -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-jp-dynamic-subset.min.css">
<link rel="stylesheet" href="css/style.css">
<!-- 저장해 둔 화면 모드(밝게/어둡게)를 화면이 그려지기 전에 먼저 적용해 깜빡임을 막는다 -->
<script>try { var t = localStorage.getItem("jlpt:theme"); if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t); } catch (e) {}</script>
</head>
<body>

<div class="wrap">
  <header class="site">
    <div>
      <h1 id="site-title">JLPT N1 <span lang="ja">合格!</span></h1>
    </div>
    <div class="site-actions">
      <span class="auth-user" id="auth-user" hidden></span>
      <button type="button" class="theme-toggle" id="theme-toggle" aria-pressed="false">다크 모드</button>
    </div>
  </header>
</div>

<nav class="tabs" aria-label="메뉴">
  <div class="wrap nav-row"><div class="tablist" id="tablist"></div><a class="room-switch" id="room-switch" href="#rooms">방 바꾸기</a></div>
</nav>

<main class="wrap" id="app" tabindex="-1">
  <p class="loading">학습 자료를 불러오는 중이에요…</p>
</main>

<footer class="wrap">
  <p>자체 제작 학습 자료이며 JLPT 공식 문제가 아니에요. 시험 일정은 <a href="https://www.jlpt.jp/" target="_blank" rel="noopener">JLPT 공식 사이트</a>에서 확인하세요.</p>
</footer>

<noscript><p class="wrap">이 사이트는 JavaScript가 켜져 있어야 작동해요.</p></noscript>
<script type="module" src="js/main.js"></script>
</body>
</html>
